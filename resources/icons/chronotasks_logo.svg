<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none">
  <defs>
    <linearGradient id="ctGrad" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="ctArc" x1="8" y1="8" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Capsule / Circle -->
  <rect x="2" y="2" width="32" height="32" rx="10" fill="url(#ctGrad)"/>

  <!-- Clock Ring Track / Stylized C -->
  <path d="M 23 11.5 A 8 8 0 1 0 25.5 18" stroke="url(#ctArc)" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- Center Pivot Dot -->
  <circle cx="18" cy="18" r="1.8" fill="#FFFFFF"/>

  <!-- Clock Hour Hand -->
  <line x1="18" y1="18" x2="18" y2="13.2" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Clock Minute Hand -->
  <line x1="18" y1="18" x2="22" y2="18" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Top Accent Tick -->
  <circle cx="24.5" cy="11.5" r="1.4" fill="#F43F5E"/>
</svg>
